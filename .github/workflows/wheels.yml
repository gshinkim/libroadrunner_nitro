# Wheels for the Python package roadrunner-nitro (import roadrunner_nitro): Windows x64, macOS arm64 and x86_64,
# Linux x86_64 and aarch64 (manylinux), plus the sdist. One abi3 wheel per platform covers Python 3.10 and later.
# Every wheel built for a runner's own platform is installed and tested there. Pushing a tag v* attaches the
# wheels to a GitHub Release (for testers: pip install <wheel url>). Publishing to PyPI is a later step.
name: wheels

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x64 }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: '2_28' }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: '2_28' }
    steps:
      - uses: actions/checkout@v4
      # .cargo/config.toml builds for the local CPU (target-cpu=native): fine on a developer's machine, but a
      # wheel built that way can stop with "illegal instruction" on an older CPU. Wheels use the baseline.
      - name: Portable build (no target-cpu=native)
        shell: bash
        run: |
          printf '# portable wheels: no target-cpu=native\n' > .cargo/config.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test:
    name: test ${{ matrix.name }} py${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the full suite (libroadrunner where it has a wheel, for the API comparison) ...
          - { name: windows-x64, os: windows-latest, python: '3.12' }
          - { name: macos-arm64, os: macos-latest, python: '3.12' }
          - { name: linux-x86_64, os: ubuntu-latest, python: '3.12' }
          # ... and the oldest and newest Python the abi3 wheel covers
          - { name: linux-x86_64, os: ubuntu-latest, python: '3.10' }
          - { name: linux-x86_64, os: ubuntu-latest, python: '3.13' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist
      - name: Install the wheel and the test tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy antimony
          python -m pip install --no-index --find-links dist roadrunner-nitro  # this wheel, never one from PyPI
          python -m pip install libroadrunner==2.11.0 || echo "no libroadrunner 2.11.0 wheel here: its comparison tests skip"
      - name: Test (the installed wheel, not the source tree)
        shell: bash
        run: |
          python -c "import roadrunner_nitro as rn; print(rn.__version__, rn.__file__)"
          python -m pytest tests -q -p no:cacheprovider

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release description (what it is, a pip install command per platform)
        run: python3 .github/release_notes.py "${{ github.repository }}" "${{ github.ref_name }}" dist > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, 'rc') }}
