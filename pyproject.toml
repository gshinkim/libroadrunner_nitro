[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "roadrunner-nitro"
version = "1.0.0rc2"
description = "A fast drop-in replacement for libroadrunner (SBML simulation), written in Rust"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy"]
keywords = ["SBML", "systems biology", "simulation", "libroadrunner", "tellurium"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Repository = "https://github.com/gshinkim/libroadrunner_nitro"

[project.optional-dependencies]
plot = ["matplotlib"]

[tool.maturin]
# The Rust extension is roadrunner_nitro.core; python/roadrunner_nitro is the public package around it.
python-source = "python"
module-name = "roadrunner_nitro.core"
features = ["python"]
